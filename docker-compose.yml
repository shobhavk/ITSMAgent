services:
  itsm-quality-agent:
    build: .
    image: itsm-quality-agent:v1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Container paths for the writable volumes (root FS is read-only).
      ITSM_DB_PATH: /app/data/itsm_analysis.db
      LOG_DIR: /app/logs
    volumes:
      - itsm_data:/app/data   # SQLite ticket/file cache
      - itsm_logs:/app/logs   # only written if LOG_FILE_ENABLED=true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  itsm_data:
  itsm_logs:
